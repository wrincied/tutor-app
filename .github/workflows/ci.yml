name: CI

on:
  pull_request:
    branches:
      - dev
      - master
  push:
    branches:
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Require pinned backend
        run: test -f backend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Audit backend production dependencies
        run: npm audit --prefix backend --omit=dev --audit-level=high

      - name: Run unit tests
        run: npm test

      - name: Run backend tests
        run: npm test --prefix backend

      - name: Build (development)
        run: npm run build:dev

  # Pages deploy lives in jekyll-gh-pages.yml (secrets-only env generation).
