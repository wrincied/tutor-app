name: Deploy Dev to GitHub Pages

# Test frontend from `dev` → https://wrincied.github.io/tutor-app/dev/
# Production hosting stays on Firebase (master / manual deploy).
on:
  push:
    branches: ['dev']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Required repo secrets — never hardcode Firebase / API values in YAML.
      DEV_API_URL: ${{ secrets.DEV_API_URL }}
      DEV_APP_URL: ${{ secrets.DEV_APP_URL }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate environment for GitHub Pages (dev test)
        run: |
          if [ -z "$DEV_API_URL" ]; then
            echo "::error::Set repository secret DEV_API_URL"
            exit 1
          fi
          if [ -z "$DEV_APP_URL" ]; then
            echo "::error::Set repository secret DEV_APP_URL (e.g. https://wrincied.github.io/tutor-app/dev)"
            exit 1
          fi
          for key in FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_PROJECT_ID FIREBASE_STORAGE_BUCKET FIREBASE_MESSAGING_SENDER_ID FIREBASE_APP_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Set repository secret $key"
              exit 1
            fi
          done
          export API_URL="$DEV_API_URL"
          export APP_URL="$DEV_APP_URL"
          export DESIGN_MODE=false
          export PRODUCTION=true
          export FORCE_ENV_GENERATE=1
          node scripts/prepare-environment.mjs production

      - name: Build Angular for GitHub Pages
        run: npx ng build --configuration=production --base-href=/tutor-app/dev/

      - name: SPA shell + .nojekyll for GitHub Pages
        run: |
          # Prerender leaves a tiny locale redirect as index.html; use the CSR shell.
          if [ -f dist/tutor/browser/index.csr.html ]; then
            cp dist/tutor/browser/index.csr.html dist/tutor/browser/index.html
          fi
          BUILD_ID="${GITHUB_SHA:0:7}"
          BUILD_AT="$(date -u +%Y-%m-%dT%H:%MZ)"
          # Visible in View Source so we can confirm the deploy is fresh.
          sed -i "s|<head>|<head>\n    <!-- simple4u-pages-build ${BUILD_ID} ${BUILD_AT} -->|" dist/tutor/browser/index.html
          cp dist/tutor/browser/index.html dist/tutor/browser/404.html
          touch dist/tutor/browser/.nojekyll
          echo "PAGES_BUILD=${BUILD_ID} ${BUILD_AT}" >> "$GITHUB_STEP_SUMMARY"

      - name: Create Root Redirect Fallback
        run: |
          mkdir -p dist/root_fallback
          touch dist/root_fallback/.nojekyll
          cat > dist/root_fallback/index.html << 'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>Simple4U</title>
              <meta http-equiv="refresh" content="0; url=/tutor-app/dev/">
              <link rel="canonical" href="/tutor-app/dev/">
              <script>location.replace('/tutor-app/dev/' + (location.hash || ''));</script>
            </head>
            <body>
              <p>Redirecting to <a href="/tutor-app/dev/">Simple4U dev</a>…</p>
            </body>
          </html>
          EOF

      - name: Deploy Angular App
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/tutor/browser
          target-folder: dev
          branch: gh-pages
          clean: true

      - name: Deploy Root Redirect
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/root_fallback
          target-folder: .
          branch: gh-pages
          clean: false

      - name: Remove obsolete /design preview folder
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/root_fallback
          target-folder: design
          branch: gh-pages
          clean: true
          # Replace stale studio preview with a redirect to /dev/
          single-commit: false
