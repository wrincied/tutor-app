    <span class="landing-skel__orb landing-skel__orb--b"></span>
  </div>

  <div class="landing-skel__nav">
    <span class="skeleton landing-skel__mark"></span>
    <span class="skeleton skeleton--line landing-skel__brand-line"></span>

    <span class="skeleton skeleton--btn landing-skel__chip"></span>
    <span class="skeleton skeleton--btn landing-skel__chip landing-skel__chip--wide"></span>
  </div>

  <div class="landing-skel__hero">
    <div class="landing-skel__copy">
      <span class="skeleton skeleton--line landing-skel__title"></span>
