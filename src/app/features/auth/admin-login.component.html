<div class="auth-split">
  <section class="auth-split__panel">
    <a routerLink="/" class="auth-split__brand" aria-label="Simple4U">
      <img
        class="auth-split__brand-mark"
        src="assets/brand/simple4u-mark.svg"
        width="36"
        height="36"
        alt=""
      />
      <span>Simple4U</span>
    </a>

    <div class="auth-split__card">
      <h1>Admin</h1>
      <p class="subtitle">Sign in with admin@simple4u.at</p>

      @if (error()) {
        <div class="auth-error">{{ error() }}</div>
      }
      @if (info()) {
        <div class="auth-banner-success">{{ info() }}</div>
      }

      <form class="auth-form" (ngSubmit)="submit()" autocomplete="on">
        <div class="field field--float">
          <input
            type="email"
            name="admin_email"
            [(ngModel)]="email"
            required
            placeholder=" "
            autocomplete="username"
            [disabled]="loading()"
          />
          <label>{{ i18n.authUi().email }}</label>
        </div>
        <div class="field field--float">
          <input
            type="password"
            name="admin_password"
            [(ngModel)]="password"
            required
            minlength="6"
            placeholder=" "
            autocomplete="current-password"
            [disabled]="loading()"
          />
          <label>{{ i18n.authUi().password }}</label>
        </div>
        <button type="submit" class="auth-btn-primary" [disabled]="loading()">
          {{ loading() ? i18n.authUi().loggingIn : i18n.authUi().login }}
        </button>
      </form>

      <a routerLink="/app/home" class="auth-split__home">{{ i18n.authUi().backHome }}</a>
    </div>
  </section>

  <aside class="auth-split__visual" aria-hidden="true">
    <div class="auth-aurora">
      <span class="auth-aurora__blob auth-aurora__blob--1"></span>
      <span class="auth-aurora__blob auth-aurora__blob--2"></span>
      <span class="auth-aurora__blob auth-aurora__blob--3"></span>
    </div>
  </aside>
</div>
