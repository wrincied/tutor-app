@switch (state()) {
  @case ('connected') {
    <button
      type="button"
      class="tg-badge tg-badge--connected"
      [class.tg-badge--compact]="compact()"
      [attr.title]="tooltip()"
      [attr.aria-label]="labels().connected + ': ' + handle()"
      (click)="onPrimaryClick($event)"
    >
      <svg class="tg-badge__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="currentColor"
          d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.695.056-1.219-.46-1.89-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.788.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"
        />
      </svg>
      <span class="tg-badge__label">{{ handle() }}</span>
      @if (chatUrl(); as url) {
        <a
          class="tg-badge__ext"
          [href]="url"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="labels().openChat"
          [attr.title]="labels().openChat"
          (click)="onOpenChat($event)"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
            <polyline points="15 3 21 3 21 9" />
            <line x1="10" y1="14" x2="21" y2="3" />
          </svg>
        </a>
      }
    </button>
  }
  @case ('paused') {
    <button
      type="button"
      class="tg-badge tg-badge--paused"
      [class.tg-badge--compact]="compact()"
      [attr.title]="tooltip()"
      [attr.aria-label]="labels().paused + ': ' + handle()"
      (click)="onPrimaryClick($event)"
    >
      <span class="tg-badge__label">{{ labels().paused }}</span>
    </button>
  }
  @case ('error') {
    <button
      type="button"
      class="tg-badge tg-badge--error"
      [class.tg-badge--compact]="compact()"
      [attr.title]="tooltip()"
      [attr.aria-label]="labels().error"
      (click)="onPrimaryClick($event)"
    >
      <svg class="tg-badge__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
        <line x1="12" y1="9" x2="12" y2="13" />
        <line x1="12" y1="17" x2="12.01" y2="17" />
      </svg>
      <span class="tg-badge__label">{{ labels().error }}</span>
    </button>
  }
  @default {
    <span class="tg-badge-wrap" [attr.title]="tooltip()">
      <span class="tg-badge tg-badge--neutral tg-badge--static" [class.tg-badge--compact]="compact()">
        <span class="tg-badge__label">{{ labels().notConnected }}</span>
      </span>
      <button type="button" class="tg-bind" (click)="onBindClick($event)">
        {{ labels().bind }}
      </button>
    </span>
  }
}
