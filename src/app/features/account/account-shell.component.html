<div class="page app-scroll-page account-page">
  <header class="account-page__mast">
    <h1 class="account-page__title">{{ i18n.accountUi().title }}</h1>
  </header>

  <nav #anchorsNav class="account-page__anchors" [attr.aria-label]="i18n.accountUi().title">
    <button
      type="button"
      class="account-page__anchor"
      data-section="acc-customization"
      [class.account-page__anchor--active]="activeSection() === 'acc-customization'"
      (click)="scrollToSection('acc-customization', $event)"
    >
      {{ i18n.accountUi().customizationTab }}
    </button>
    <button
      type="button"
      class="account-page__anchor"
      data-section="acc-profile"
      [class.account-page__anchor--active]="activeSection() === 'acc-profile'"
      (click)="scrollToSection('acc-profile', $event)"
    >
      {{ i18n.accountUi().accountTab }}
    </button>
    <button
      type="button"
      class="account-page__anchor"
      data-section="acc-support"
      [class.account-page__anchor--active]="activeSection() === 'acc-support'"
      (click)="scrollToSection('acc-support', $event)"
    >
      {{ i18n.accountUi().supportTab }}
    </button>
  </nav>

  <div class="scrollable-content account-page__body">
    <section id="acc-customization" class="account-page__section">
      <app-account-customization />
    </section>

    <section id="acc-profile" class="account-page__section">
      <app-account-profile />
    </section>

    <div class="account-page__tail">
      <section id="acc-support" class="account-page__section">
        <app-account-support />
      </section>

      <div class="account-page__logout">
        <button type="button" class="account-logout-btn" (click)="logout()">
          {{ i18n.nav().logout }}
        </button>
      </div>
    </div>
  </div>

  <!-- Keep child routes active for deep links without rendering duplicate UI -->
  <div class="account-page__route-stub" aria-hidden="true">
    <router-outlet />
  </div>
</div>
