@if (loading()) {
  <div
    class="account-skeleton skeleton-page"
    role="status"
    aria-busy="true"
    [attr.aria-label]="i18n.sharedUi().loadingContent"
  >
    <span class="sr-only">{{ i18n.sharedUi().loadingContent }}</span>
    <div class="skeleton-form-card">
      <span class="skeleton skeleton--line skeleton--line-lg" style="width: 40%"></span>
      <span class="skeleton skeleton--line skeleton--block" style="height: 2.75rem"></span>
    </div>
  </div>
} @else {
  <section class="account-panel">
    <div class="account-section">
      <h2 class="account-section__title">{{ i18n.accountUi().settingsSection }}</h2>

      <div class="account-setting account-setting--row">
        <label class="account-setting__label" for="account-lang">{{ i18n.accountUi().language }}</label>
        <div class="account-lang-select">
          <app-select
            id="account-lang"
            name="accountLang"
            [ngModel]="i18n.lang()"
            (ngModelChange)="pickLang($event)"
            [options]="languageOptions()"
            menuPlacement="below"
          />
        </div>
      </div>
    </div>
  </section>
}
