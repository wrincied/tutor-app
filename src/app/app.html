@if (showNavbar()) {
  <div class="app-shell">
    <app-navbar />
    <app-header />
    <div class="app-content">
      <div class="app-page-host">
        <router-outlet />
      </div>
    </div>
    <app-bottom-nav />
  </div>
} @else {
  <div class="app-public-host">
    @if (landingRouteLoading()) {
      <div class="app-public-skel">
        <app-landing-skeleton />
      </div>
    }
    <router-outlet />
  </div>
}

<app-dialog
  [open]="!!unlinkAlert.alert()"
  size="sm"
  [title]="unlinkDialogTitle()"
  [dismissLabel]="unlinkDialogOk()"
  (cancel)="unlinkAlert.dismiss()"
>
  @if (unlinkAlert.alert(); as alert) {
    <p class="bot-unlink-alert">
      {{ unlinkDialogLead() }}<strong [style.color]="alert.studentColor">{{ alert.studentName }}</strong>@if (alert.telegramUsername) {
        <span> (@{{ alert.telegramUsername }})</span>
      }{{ unlinkDialogTail() }}
    </p>
    <p class="bot-unlink-alert__note">{{ unlinkDialogNote() }}</p>
  }
</app-dialog>

<app-cookie-consent-banner />
