<div class="profile-menu" [class.profile-menu--open]="menuOpen()">
  <button
    type="button"
    class="profile-menu__trigger"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-haspopup]="true"
    [attr.aria-label]="i18n.nav().account"
    (click)="toggleMenu($event)"
  >
    <span class="profile-menu__avatar" aria-hidden="true">{{ avatarLabel() }}</span>
  </button>

  @if (menuOpen()) {
    <div class="profile-menu__panel" role="menu">
      <a [routerLink]="lp('/app/account')" class="profile-menu__item" role="menuitem" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>{{ i18n.nav().account }}</span>
      </a>

      <a [routerLink]="lp('/app/workspace')" class="profile-menu__item" role="menuitem" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="2" y="7" width="20" height="14" rx="2"/>
          <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
          <line x1="12" y1="12" x2="12" y2="16"/>
          <line x1="10" y1="14" x2="14" y2="14"/>
        </svg>
        <span>{{ i18n.nav().workspace }}</span>
      </a>

      @if (isAdmin()) {
        <a [routerLink]="lp('/app/admin')" class="profile-menu__item" role="menuitem" (click)="closeMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 15v2"/>
            <path d="M12 3v2"/>
            <rect x="4" y="8" width="16" height="12" rx="2"/>
            <path d="M8 8V6a4 4 0 0 1 8 0v2"/>
          </svg>
          <span>{{ i18n.nav().admin }}</span>
        </a>
      }

      <button type="button" class="profile-menu__item profile-menu__item--logout" role="menuitem" (click)="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>{{ i18n.nav().logout }}</span>
      </button>
    </div>
  }
</div>
