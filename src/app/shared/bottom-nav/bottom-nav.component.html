<div class="bottom-nav-shell">
  <nav class="bottom-nav" aria-label="Main navigation">
    <a
      [routerLink]="lp('/app/home')"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }"
      class="bottom-link"
      (click)="closeMore()"
    >
      <span class="bottom-link__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/>
        </svg>
      </span>
      <span class="sr-only">{{ i18n.nav().home }}</span>
    </a>

    <a
      [routerLink]="lp('/app/students')"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }"
      class="bottom-link"
      (click)="closeMore()"
    >
      <span class="bottom-link__icon" aria-hidden="true">
        <svg class="nav-icon--students" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </span>
      <span class="sr-only">{{ i18n.nav().students }}</span>
    </a>

    <a
      [routerLink]="lp('/app/calendar')"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }"
      class="bottom-link"
      (click)="closeMore()"
    >
      <span class="bottom-link__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
      </span>
      <span class="sr-only">{{ i18n.nav().calendar }}</span>
    </a>

    <a
      [routerLink]="lp('/app/finance')"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }"
      class="bottom-link"
      (click)="closeMore()"
    >
      <span class="bottom-link__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="1" x2="12" y2="23"/>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
      </span>
      <span class="sr-only">{{ i18n.nav().finance }}</span>
    </a>

    <div class="bottom-more" [class.bottom-more--open]="moreOpen()">
      <button
        type="button"
        class="bottom-link bottom-link--more"
        [class.active]="isMoreRouteActive()"
        [attr.aria-expanded]="moreOpen()"
        [attr.aria-haspopup]="true"
        [attr.aria-label]="i18n.nav().more"
        (click)="toggleMore($event)"
      >
        <span class="bottom-link__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="5" r="1.5" fill="currentColor" stroke="none"/>
            <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
            <circle cx="12" cy="19" r="1.5" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span class="sr-only">{{ i18n.nav().more }}</span>
      </button>

      @if (moreOpen()) {
        <div class="bottom-more__sheet" role="menu">
          <a [routerLink]="lp('/app/workspace')" class="bottom-more__item" role="menuitem" (click)="closeMore()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="2" y="7" width="20" height="14" rx="2"/>
              <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
              <line x1="12" y1="12" x2="12" y2="16"/>
              <line x1="10" y1="14" x2="14" y2="14"/>
            </svg>
            <span>{{ i18n.nav().workspace }}</span>
          </a>

          <a [routerLink]="lp('/app/account')" class="bottom-more__item" role="menuitem" (click)="closeMore()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span>{{ i18n.nav().account }}</span>
          </a>

          @if (isAdmin()) {
            <a [routerLink]="lp('/app/admin')" class="bottom-more__item" role="menuitem" (click)="closeMore()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M12 15v2"/>
                <path d="M12 3v2"/>
                <rect x="4" y="8" width="16" height="12" rx="2"/>
                <path d="M8 8V6a4 4 0 0 1 8 0v2"/>
              </svg>
              <span>{{ i18n.nav().admin }}</span>
            </a>
          }

          <button
            type="button"
            class="bottom-more__item bottom-more__item--logout"
            role="menuitem"
            (click)="logout()"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>{{ i18n.nav().logout }}</span>
          </button>
        </div>
      }
    </div>
  </nav>
</div>
