    <script>
      (function () {
        var hash = location.hash || '';
        if (hash.indexOf('#/') !== 0) {
          return;
        }
        var rest = hash.slice(1);
        var path = rest.split('?')[0];
        var hashQuery = rest.indexOf('?') >= 0 ? rest.slice(rest.indexOf('?') + 1) : '';
        var baseEl = document.querySelector('base');
        var baseHref = (baseEl && baseEl.getAttribute('href')) || '/';
        if (baseHref !== '/' && path.indexOf(baseHref.replace(/\/$/, '')) !== 0) {
          path = baseHref.replace(/\/$/, '') + path;
        }
        var params = new URLSearchParams(location.search || '');
        var extra = new URLSearchParams(hashQuery);
        extra.forEach(function (value, key) {
          if (!params.has(key)) {
            params.set(key, value);
          }
        });
        var query = params.toString();
        history.replaceState(null, '', path + (query ? '?' + query : ''));
      })();
    </script>
